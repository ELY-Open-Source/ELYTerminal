[package]
name = "elyterminal"
version = "0.1.9"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A terminal on GPUI and Ely."
repository = "https://github.com/ELY-Open-Source/ELYTerminal"
publish = false

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1"
base64 = "0.22"
dirs = "7"
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components.git", rev = "494c17d6e631e9e3948f26ff9306ba9c3c8ae47a" }
env_logger = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
gethostname = "1.1.0"
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
polling = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
unicode-segmentation = "1.13"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
resvg = { version = "0.46", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix-openpty = "0.2"
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
xim-ctext = "=0.3.0"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-server = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"
raw-window-handle = "0.6"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
foreign-types = "0.5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_IO"] }

[patch.crates-io]
alacritty_terminal = { git = "https://github.com/ELY-Open-Source/alacritty.git", rev = "e097276640948502cd96d981f48829431d9e3e51" }
vte = { git = "https://github.com/ELY-Open-Source/vte.git", rev = "809757d59985b3b1d185b5496122569985143bc1" }
xim-ctext = { path = "vendor/xim-ctext" }
gpui-pre-windows = { git = "https://github.com/ELY-Open-Source/gpui-pre-windows.git", rev = "825bfc3e99bf80bc7705dbbc37f540e8e141d11f" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "fonts"
harness = false
