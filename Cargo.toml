[package]
name = "elyterminal"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A terminal on GPUI and Ely."
repository = "https://github.com/ELY-Open-Source/ELYTerminal"
publish = false

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1"
base64 = "0.22"
base64-simd = "0.8"
dirs = "7"
ely-gpui-component = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components.git", rev = "d1d7cf78fd276410583c8a7632fd183b0d782397" }
env_logger = "0.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
gethostname = "1.1.0"
getrandom = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
memchr = "2.8"
polling = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
unicode-segmentation = "1.13"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
resvg = { version = "0.46", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix-openpty = "0.2"
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
xim-ctext = "=0.3.0"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-server = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"
raw-window-handle = "0.6"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
foreign-types = "0.5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_IO"] }

[patch.crates-io]
alacritty_terminal = { git = "https://github.com/ELY-Open-Source/alacritty.git", rev = "d2781caf4908e58404a31efa0bbac03c562380bc" }
vte = { git = "https://github.com/ELY-Open-Source/vte.git", rev = "8fa83a9b51cadcad3269e1ef3ab059672d875983" }
xim-ctext = { path = "vendor/xim-ctext" }
gpui-pre-windows = { git = "https://github.com/ELY-Open-Source/gpui-pre-windows.git", rev = "8b9ce598956472934fcd54a060a9153575877475" }
gpui-pre-macos = { git = "https://github.com/ELY-Open-Source/gpui-pre-macos.git", rev = "bf1ce7c431459d23522884d7e668183bd5fb9555" }
gpui-pre-linux = { git = "https://github.com/ELY-Open-Source/gpui-pre-linux.git", rev = "db0ff3c44e3fb1a3ee6ba6a06a44d94bf5d1ff32" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }

[[test]]
name = "fonts"
harness = false
