name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v7
      # The runner's PATH lacks the host's rustup.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install --no-self-update
      - run: scripts/check.sh
      - run: cargo build --locked

  windows-arm:
    runs-on: windows-11-arm
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      # A cold first PowerShell outruns the shell tests.
      - name: Warm up Windows PowerShell
        shell: pwsh
        run: |
          $powershell = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell -NoProfile -NonInteractive -Command "Write-Output 'PowerShell warm-up complete'"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell warm-up failed with exit code $LASTEXITCODE"
          }
      - run: cargo test --locked --quiet
      - run: cargo build --locked
      - name: Build Windows ARM64 package
        shell: pwsh
        run: ./scripts/windows-zip.ps1
      - name: Keep Windows ARM64 package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ELYTerminal-windows-aarch64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: target/release/ELYTerminal-*-windows-aarch64.zip

  windows:
    runs-on: [self-hosted, ely-windows]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo test --locked --quiet
      - run: cargo build --locked

  linux:
    runs-on: ubuntu-24.04
    # A clean image: the hosted one's zsh and fish setup breaks the shell tests.
    container: docker.gitea.com/runner-images:ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # The job container comes without rustup.
      - run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The job container runs as root, which ignores the file permissions the tests check.
      - run: |
          apt-get update && apt-get install -y --no-install-recommends pkg-config libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev \
            libfreetype-dev zsh fish xvfb
          useradd --create-home ci
          chmod o+x "$HOME"
          chown -R ci "$GITHUB_WORKSPACE" "$HOME/.cargo" "$HOME/.rustup"
          runuser -u ci -- env HOME=/home/ci CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" PATH="$PATH" cargo test --locked --quiet
      - run: cargo build --locked
